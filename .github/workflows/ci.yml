name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run backend tests
        run: python -m pytest
      - name: Compile backend
        run: python -m compileall -q app

  postgres:
    name: PostgreSQL / Alembic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: devlens_ci
          POSTGRES_USER: devlens_ci
          POSTGRES_PASSWORD: devlens_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devlens_ci -d devlens_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s
    env:
      DATABASE_URL: postgresql+asyncpg://devlens_ci:devlens_ci@127.0.0.1:5432/devlens_ci
      DEVLENS_TEST_DATABASE_URL: postgresql+asyncpg://devlens_ci:devlens_ci@127.0.0.1:5432/devlens_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Clean migration upgrade
        run: alembic upgrade head
      - name: Assert one Alembic head
        shell: bash
        run: |
          head_count="$(alembic heads | awk '/\(head\)/ { count++ } END { print count + 0 }')"
          test "$head_count" -eq 1
      - name: Check migration drift
        run: alembic check
      - name: Verify downgrade and re-upgrade
        run: |
          alembic downgrade -1
          alembic upgrade head
          alembic check
      - name: Run PostgreSQL integration tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest \
            tests/test_db_integration.py \
            tests/test_persistence_cache_final_postgres.py \
            tests/test_snapshot_public_postgres.py \
            -q -rs 2>&1 | tee /tmp/devlens-postgres-pytest.txt
          if grep -Eq '[0-9]+ skipped' /tmp/devlens-postgres-pytest.txt; then
            echo 'Mandatory PostgreSQL tests must not be skipped.' >&2
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Tests
        run: npm run test
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      POSTGRES_DB: devlens_ci
      POSTGRES_USER: devlens_ci
      POSTGRES_PASSWORD: devlens_ci
      DATABASE_URL: postgresql+asyncpg://devlens_ci:devlens_ci@db:5432/devlens_ci
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      ANALYSIS_CACHE_TTL_SECONDS: '900'
      GITHUB_TOKEN: ''
      GEMINI_API_KEY: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config >/tmp/devlens-compose-config.txt
      - name: Build production images
        run: docker compose build
      - name: Start production stack
        run: docker compose up -d
      - name: Verify service health and HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            backend_health="$(docker compose ps --format '{{.Service}} {{.Health}}' | awk '$1 == "backend" { print $2 }')"
            frontend_health="$(docker compose ps --format '{{.Service}} {{.Health}}' | awk '$1 == "frontend" { print $2 }')"
            if [ "$backend_health" = healthy ] \
              && [ "$frontend_health" = healthy ] \
              && curl --fail --silent http://127.0.0.1:8000/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose ps
              exit 1
            fi
            sleep 2
          done
          test "$(docker compose ps --format '{{.Service}} {{.Health}}' | awk '$1 == "backend" { print $2 }')" = healthy
          test "$(docker compose ps --format '{{.Service}} {{.Health}}' | awk '$1 == "frontend" { print $2 }')" = healthy
          test "$(docker compose ps --all --format '{{.Service}} {{.State}}' | awk '$1 == "migrate" { print $2 }')" = exited
      - name: Verify non-root runtime
        run: |
          test "$(docker compose exec -T backend id -u)" != 0
          test "$(docker compose exec -T frontend id -u)" != 0
      - name: Capture Docker diagnostics on failure
        if: ${{ failure() }}
        run: |
          docker compose ps
          docker compose logs --no-color backend frontend migrate
      - name: Clean Docker resources
        if: ${{ always() }}
        run: docker compose down -v --remove-orphans

  required:
    name: Required quality gates
    if: ${{ always() }}
    needs:
      - backend
      - postgres
      - frontend
      - docker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all quality gates
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          set -euo pipefail
          printf 'backend=%s postgres=%s frontend=%s docker=%s\n' \
            "$BACKEND_RESULT" "$POSTGRES_RESULT" "$FRONTEND_RESULT" "$DOCKER_RESULT"
          test "$BACKEND_RESULT" = success
          test "$POSTGRES_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$DOCKER_RESULT" = success
